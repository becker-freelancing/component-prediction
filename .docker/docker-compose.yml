version: "3.9"
services:
  metadata-db:
    image: postgres:latest
    networks:
      - devnet
    volumes:
      - metadata-db-data:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}

  vector-db:
    image: qdrant/qdrant:latest
    networks:
      - devnet
    volumes:
      - vector-db-data:/qdrant/storage
    environment:
      - QDRANT__SERVICE__GRPC_PORT=6334
      - QDRANT__SERVICE__HTTP_PORT=6333
      - QDRANT__STORAGE__STORAGE_PATH=/qdrant/storage

  database-migration:
    image: beckerfreelancing/database-migration:${IMAGE_VERSION}
    ports:
      - "5005:5005" # DEBUGGING
    depends_on:
      - metadata-db
    networks:
      - devnet
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_PORT: 5432
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES}
      JAVA_TOOL_OPTIONS: ${JAVA_TOOL_OPTIONS_DATABASE_MIGRATION} # DEBUGGING

  backend-storage-service:
    image: beckerfreelancing/backend-storage-service:${IMAGE_VERSION}
    ports:
      - "5006:5005" # DEBUGGING
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES}
      JAVA_TOOL_OPTIONS: ${JAVA_TOOL_OPTIONS_BACKEND_STORAGE_SERVICE} # DEBUGGING
    depends_on:
      - metadata-db
      - database-migration
      - vector-db
    networks:
      - devnet

  embedding-service:
    image: beckerfreelancing/backend-embedding-service:${IMAGE_VERSION}
    environment:
      EMBEDDING_USE_L2_NORMALIZATION: ${EMBEDDING_USE_L2_NORMALIZATION}
      EMBEDDING_CHUNK_SIZE: ${EMBEDDING_CHUNK_SIZE}
      EMBEDDING_CHUNK_OVERLAP: ${EMBEDDING_CHUNK_OVERLAP}
      EMBEDDING_CHUNK_THRESHOLD: ${EMBEDDING_CHUNK_THRESHOLD}
    networks:
      - devnet

  language-service:
    image: beckerfreelancing/language-detection-service:${IMAGE_VERSION}
    networks:
      - devnet



  query-service:
    image: beckerfreelancing/backeng-query-service:${IMAGE_VERSION}
    depends_on:
      - backend-storage-service
    networks:
      - devnet

  ingest-service:
    image: beckerfreelancing/backeng-ingest-service:${IMAGE_VERSION}
    depends_on:
      - embedding-service
      - backend-storage-service
      - language-service
      - query-service
    networks:
      - devnet


  backend-gateway:
    image: beckerfreelancing/backend-gateway:${IMAGE_VERSION}
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES}
      JAVA_TOOL_OPTIONS: ${JAVA_TOOL_OPTIONS_BACKEND_GATEWAY} # DEBUGGING
    depends_on:
      - ingest-service
      - query-service
    networks:
      - devnet
    ports:
      - ${BACKEND_GATEWAY_PORT}:8080
      - "5007:5005" # DEBUGGING


networks:
  devnet:
    driver: bridge

volumes:
  metadata-db-data:
  vector-db-data: