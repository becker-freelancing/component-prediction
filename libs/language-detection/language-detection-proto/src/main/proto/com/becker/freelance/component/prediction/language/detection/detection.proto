syntax = "proto3";

option java_multiple_files = true;


package com.becker.freelance.component.prediction.language.detection;

message GrpcLocale {
    string locale = 1;
}

message GrpcLanguageDetectionQuery {
    string query = 1;
}

service GrpcLanguageDetector {

    rpc DetectLanguage (GrpcLanguageDetectionQuery) returns (GrpcLocale);
}